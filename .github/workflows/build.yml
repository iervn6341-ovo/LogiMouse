name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build app
        run: BUILD_NUMBER=${{ github.run_number }} ./scripts/build-app.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LogiMouse
          path: build/LogiMouse.zip
